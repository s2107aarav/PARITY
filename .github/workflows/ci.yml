name: verification
on: [push, pull_request]
jobs:
  local-evidence:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make setup
      - run: make check
      - run: make test
      - run: make demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-evidence
          path: artifacts/reports/
