name: verification
on: [push, pull_request]
jobs:
  local-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux isolation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: make setup
      - run: make check
      - run: make test
      - run: make demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-evidence-${{ matrix.os }}
          path: .parity/reports/
